name: Harness CI

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.agents/**'
      - '.codex/**'
      - '.github/workflows/harness-ci.yml'
      - '.opencode/**'
      - 'harness/**'
      - 'scripts/**'
      - 'tests/**'
      - 'justfile'
      - 'opencode.jsonc'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - '.agents/**'
      - '.codex/**'
      - '.github/workflows/harness-ci.yml'
      - '.opencode/**'
      - 'harness/**'
      - 'scripts/**'
      - 'tests/**'
      - 'justfile'
      - 'opencode.jsonc'

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Validate harness
        run: python3 scripts/validate_harness.py

      - name: Verify generated adapters
        run: python3 scripts/verify_generated_files.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Install actionlint 1.7.12
        run: GOBIN="$RUNNER_TEMP" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate workflows
        run: |
          "$RUNNER_TEMP/actionlint"

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: harness/runtime/package-lock.json

      - name: Install pinned Promptfoo runtime
        run: npm --prefix harness/runtime ci

      - name: Run smoke and fast policy evaluations
        run: |
          python3 scripts/run_harness_eval.py smoke
          python3 scripts/run_harness_eval.py fast
