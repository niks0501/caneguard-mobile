appId: com.niks0501.caneguard
name: T03 direct result to minimum Field Report submission
tags:
  - t03
  - field-report
  - direct-result
  - synchronization
---
# Verifies the minimum-effort path without opening a saved Scan Record first:
# Scan -> AI-assisted result -> Report to Office -> prefilled Draft -> four
# required operational entries -> automatic GPS -> finalized and synced.
# The farm-reference field intentionally uses a local farm identifier rather
# than a person name. Existing app state and authentication are preserved.
# The fixture image is staged by the harness before this flow runs.
- setPermissions:
    permissions:
      location: allow
- addMedia:
    - ../../assets/model-fixtures/parity-reference.jpg
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- openLink: caneguardmobile:///scan
- extendedWaitUntil:
    visible:
      id: scan.screen
    timeout: 30000
- tapOn:
    id: scan.choose-gallery
- extendedWaitUntil:
    visible: "Photo taken on .*"
    timeout: 15000
- tapOn:
    text: "Photo taken on .*"
    index: 0
- runFlow:
    when:
      visible: Done
    commands:
      - tapOn: Done
- extendedWaitUntil:
    visible:
      id: scan.preview-screen
    timeout: 30000
- tapOn:
    id: scan.analyze-image
    enabled: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: scan.symptom-checklist-screen
    timeout: 120000
- tapOn:
    id: scan.symptom-rust
- tapOn:
    id: scan.continue-to-result
- extendedWaitUntil:
    visible:
      id: scan.result-title
      text: "Possible result: Rust"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: scan.report-to-office
    direction: DOWN
- tapOn:
    id: scan.report-to-office
    enabled: true
- extendedWaitUntil:
    visible:
      id: field-report.screen
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: field-report.minimum-requirements
    timeout: 30000
- assertVisible:
    id: field-report.summary
- scrollUntilVisible:
    element:
      id: field-report.observed-at
    direction: DOWN
- assertVisible:
    id: field-report.observed-at
- scrollUntilVisible:
    element:
      id: field-report.submitter
    direction: DOWN
- assertVisible:
    id: field-report.submitter
    text: ".*Field reporter"
- scrollUntilVisible:
    element:
      text: "Nasugbu, Batangas"
    direction: UP
- assertVisible: "Nasugbu, Batangas"
- scrollUntilVisible:
    element:
      id: field-report.farmer-name-input
    direction: DOWN
- tapOn:
    id: field-report.farmer-name-input
- inputText: T03 Farm Block 12
- pressKey: BACK
- tapOn:
    id: field-report.barangay-input
- inputText: Wawa
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: field-report.barangay-input-option
      text: Wawa
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: field-report.barangay-input-option
      text: Wawa
    timeout: 10000
- tapOn:
    id: field-report.barangay-input-option
    index: 0
- scrollUntilVisible:
    element:
      id: field-report.affected-area-input
    direction: DOWN
- tapOn:
    id: field-report.affected-area-input
- inputText: "1.25"
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: field-report.affected-portion-input
    direction: DOWN
- tapOn:
    id: field-report.affected-portion-input
- inputText: "40"
- pressKey: BACK
# The report's new Draft automatically attempts one foreground GPS reading.
# No separate Save Record or Create Field Report action is needed, and a
# resolved GPS reading lets the reporter finalize directly from this form.
- scrollUntilVisible:
    element:
      id: field-report.gps-status
    direction: DOWN
- assertVisible:
    id: field-report.gps-status
- scrollUntilVisible:
    element:
      id: field-report.finalize
    direction: UP
- extendedWaitUntil:
    visible:
      id: field-report.finalize
      enabled: true
    timeout: 30000
- tapOn:
    id: field-report.finalize
- scrollUntilVisible:
    element:
      id: field-report.authoring-status
    direction: UP
- extendedWaitUntil:
    visible: "This report is finalized locally\\. Current synchronization status: (Needs attention|Pending upload|Uploading|Synced|Sync failed|Waiting to sync|Will retry automatically)\\."
    timeout: 30000
- runFlow:
    when:
      visible:
        id: field-report.retry-sync
    commands:
      - tapOn:
          id: field-report.retry-sync
- extendedWaitUntil:
    visible: "This report is finalized locally\\. Current synchronization status: Synced\\."
    timeout: 120000
- assertVisible: "Server report UUID"
- takeScreenshot: .maestro/artifacts/t03-direct-result-to-report-synced
