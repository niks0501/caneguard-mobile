appId: com.niks0501.caneguard
name: Auth v1 login, session bootstrap, and authenticated report boundary
tags:
  - auth-v1
  - auth-login
  - auth-report-boundary
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible: "Continue|Close|Get Started"
    timeout: 30000
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: Get Started
    timeout: 120000
- tapOn: I already have an account
- extendedWaitUntil:
    visible:
      id: auth.login-screen
    timeout: 30000
- tapOn:
    id: auth.email-input
- inputText: ${AUTH_EMAIL}
- tapOn:
    id: auth.password-input
- inputText: ${AUTH_PASSWORD}
- tapOn:
    id: auth.login-submit
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- assertVisible:
    id: home.connection-status
- assertVisible: Start Scan
- assertVisible: My Activity
- tapOn:
    text: Open settings
- extendedWaitUntil:
    visible: Settings
    timeout: 30000
- tapOn:
    id: settings.account-security
- extendedWaitUntil:
    visible: Account & security
    timeout: 30000
- assertVisible: "Session expires .*"
- assertVisible: "Biometric unlock"
- takeScreenshot: .maestro/artifacts/auth-v1-login-session-bootstrap
- pressKey: BACK
- extendedWaitUntil:
    visible: Settings
    timeout: 30000
- pressKey: BACK
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 30000
- tapOn: Start Scan
- extendedWaitUntil:
    visible:
      id: scan.screen
    timeout: 30000
- assertVisible:
    id: scan.choose-gallery
- takeScreenshot: .maestro/artifacts/auth-v1-authenticated-report-boundary
