appId: com.niks0501.caneguard
name: T04 Activity navigation and record discovery
tags:
  - p0
  - activity
---
# Prerequisites (performed outside this flow):
# - a current Android development build and matching Metro bundle;
# - an authenticated field reporter session;
# - at least one saved scan-only observation; and
# - at least one synchronized Field Report owned by the signed-in reporter.
# The flow preserves application state and does not add credentials or fixtures.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- tapOn:
    id: nav.activity
- extendedWaitUntil:
    visible:
      id: activity.screen
    timeout: 30000
- assertVisible: Activity
- assertVisible:
    id: activity.filter.all
- assertVisible:
    id: activity.filter.reports
- assertVisible:
    id: activity.filter.scans
- assertVisible:
    id: activity.timeline
- assertVisible:
    text: "Open .* scan saved .*"
- assertVisible:
    text: "Open .* report saved .*"
- tapOn:
    text: "Open .* report saved .*"
    index: 0
- extendedWaitUntil:
    visible:
      id: records.details-screen
    timeout: 30000
- assertVisible:
    id: records.result-title
- pressKey: BACK
- extendedWaitUntil:
    visible:
      id: activity.screen
    timeout: 30000
- tapOn:
    id: activity.filter.reports
- extendedWaitUntil:
    visible:
      id: activity.screen
    timeout: 30000
- assertVisible:
    text: "Open .* report saved .*"
- tapOn:
    id: activity.filter.scans
- extendedWaitUntil:
    visible:
      id: activity.screen
    timeout: 30000
- assertVisible:
    text: "Open .* scan saved .*"
- takeScreenshot: .maestro/artifacts/t04-activity-navigation-and-discovery
