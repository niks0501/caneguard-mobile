
ignore_patterns:
  - "graphify-out/**"

document:
  instructions: |
    README.md owns setup; PROJECT_CHECKS.md owns verification commands.
    PROJECT_STACK.md owns architecture and platform rules.
    docs/ owns detailed feature and operational guidance.

test:
  instructions: |
    Use PROJECT_CHECKS.md to select affected fast tests; full regression belongs in CI.
    Run live acceptance whenever the tier justifies it; no separate authorization is needed.
    Web-first proof before any phone claim: npm run web:validate (stub API, fake accounts, isolated session, open /login not /; docs/qa/web-validation.md).
    Browser/Jest mocks cannot prove TFLite, permissions, secure storage or device persistence; prove those on a device or emulator (npm run e2e for flows).
    Device entry point is npm run live:up (docs/qa/live-validation.md). Never spend EAS for dev verification; the dev APK is local-only.
    Reuse the fingerprint-matched .apk-cache/<fingerprint>/<sha>.apk; rebuild with ./gradlew :app:assembleDebug + adb install -r only on native change.
    agent-device is the mandated phone driver: issue every command through npm run live:ad. The run log (.agent-device/test-artifacts/live/<rev>/transcript.md) must name agent-device and list every navigation and input command verbatim; adb-only or unlogged taps are not device proof.
    A missing phone or APK (no ready native target; live:up records DEVICE_UNAVAILABLE and the web:validate fallback) is inconclusive, never a pass; defects are no-go.
    Record revision, command, fingerprint, APK SHA and evidence paths (screenshots/, db/, transcript.md, run.json under .agent-device/test-artifacts/live/<rev>/); unavailable required evidence is inconclusive.
