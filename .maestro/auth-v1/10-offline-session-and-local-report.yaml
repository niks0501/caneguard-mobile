appId: com.niks0501.caneguard
name: Auth v1 cached session and local report evidence while offline
tags:
  - auth-v1
  - auth-offline
  - auth-report-boundary
---
# Precondition: authenticate with 01-login-session-and-report-boundary.yaml,
# then enable airplane mode on the emulator before running this flow.
- setPermissions:
    permissions:
      location: deny
- addMedia:
    - ../../assets/model-fixtures/parity-reference.jpg
- stopApp
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible: "Back to login|Offline"
    timeout: 120000
- runFlow:
    when:
      visible: Back to login
    commands:
      - tapOn: Back to login
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 30000
- assertVisible:
    id: home.connection-status
    text: Offline
- tapOn: Start Scan
- extendedWaitUntil:
    visible:
      id: scan.screen
    timeout: 30000
- tapOn:
    id: scan.choose-gallery
- extendedWaitUntil:
    visible: "Photo taken on .*"
    timeout: 15000
- tapOn:
    text: "Photo taken on .*"
    index: 0
- runFlow:
    when:
      visible: Done
    commands:
      - tapOn: Done
- extendedWaitUntil:
    visible:
      id: scan.preview-screen
    timeout: 30000
- tapOn:
    id: scan.analyze-image
    enabled: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: scan.symptom-checklist-screen
    timeout: 120000
- tapOn:
    id: scan.symptom-rust
- tapOn:
    id: scan.continue-to-result
- extendedWaitUntil:
    visible:
      id: scan.result-title
      text: "Possible result: Rust"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: scan.keep-as-scan-only
    direction: DOWN
- tapOn:
    id: scan.keep-as-scan-only
    enabled: true
- extendedWaitUntil:
    visible:
      id: scan.record-saved
    timeout: 30000
- assertVisible: Scan saved on this device
- takeScreenshot: .maestro/artifacts/auth-v1-offline-local-scan
