appId: com.niks0501.caneguard
name: Auth v1 generic password recovery request
tags:
  - auth-v1
  - auth-recovery
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible: "Continue|Close|Get Started"
    timeout: 30000
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: Get Started
    timeout: 120000
- tapOn: I already have an account
- extendedWaitUntil:
    visible:
      id: auth.login-screen
    timeout: 30000
- tapOn:
    id: auth.forgot-password
- extendedWaitUntil:
    visible:
      id: forgot-password.email-input
    timeout: 30000
- tapOn:
    id: forgot-password.email-input
- inputText: ${AUTH_EMAIL}
- tapOn:
    id: forgot-password.submit
- extendedWaitUntil:
    visible:
      id: forgot-password.success
    timeout: 30000
- assertVisible: Check your email
- assertVisible: "If an account matches, a password recovery link will be sent.*"
- assertVisible: 'Open the link on this device\. The one-time value is never displayed or saved by CaneGuard\.'
- takeScreenshot: .maestro/artifacts/auth-v1-generic-password-recovery
