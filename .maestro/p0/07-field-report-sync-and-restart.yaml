appId: com.niks0501.caneguard
name: P0-07 Field Report sync identity and restart persistence
tags:
  - p0
  - field-report
  - synchronization
---
# Prerequisites: authenticated field reporter, reachable API, fresh native build.
# P0-06 creates and locally finalizes a report under a stable Field Report ID.
- runFlow: 06-complete-in-field-finalization.yaml
- extendedWaitUntil:
    visible: "Finalized · (Needs attention|Pending upload|Uploading|Synced|Sync failed)"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: field-report.retry-sync
    commands:
      - tapOn:
          id: field-report.retry-sync
- extendedWaitUntil:
    visible: "Finalized · Synced"
    timeout: 120000
- assertVisible: "Server report UUID"
- assertVisible: "Last synchronized"
- takeScreenshot: .maestro/artifacts/p0-07-field-report-synced
- stopApp
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible:
      id: field-report.screen
    timeout: 120000
- assertVisible: "Finalized · Synced"
- assertVisible: "Server report UUID"
- takeScreenshot: .maestro/artifacts/p0-07-field-report-synced-after-restart
