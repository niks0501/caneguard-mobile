appId: com.niks0501.caneguard
name: Auth v1 rejects non-field-reporter Mobile login
tags:
  - auth-v1
  - auth-role-boundary
  - auth-negative
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible: "Continue|Close|Get Started"
    timeout: 30000
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: Get Started
    timeout: 120000
- tapOn: I already have an account
- extendedWaitUntil:
    visible:
      id: auth.login-screen
    timeout: 30000
- tapOn:
    id: auth.email-input
- inputText: ${AUTH_REVIEWER_EMAIL}
- tapOn:
    id: auth.password-input
- inputText: ${AUTH_REVIEWER_PASSWORD}
- tapOn:
    id: auth.login-submit
- extendedWaitUntil:
    visible: 'Only field-reporter accounts can use mobile synchronization\.'
    timeout: 30000
- assertNotVisible:
    id: home.screen
- takeScreenshot: .maestro/artifacts/auth-v1-role-enforcement
