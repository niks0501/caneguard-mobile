name: Mobile build

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Build lane
        type: choice
        required: true
        options:
          - development
          - preview
          - qa
          - production
      bump:
        description: App-version bump
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: mobile-build-${{ inputs.lane }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run free verification lane
        run: npm run verify:fast

      - name: Require dispatch from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Mobile builds must be dispatched from main; received $GITHUB_REF." >&2
            exit 1
          fi

      - name: Check production EAS environment
        if: inputs.lane == 'production'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@25.3.0 env:exec production 'node -e "for (const name of [\"EXPO_PUBLIC_API_BASE_URL\", \"EXPO_PUBLIC_AUTH_LINK_HOST\"]) { if (!process.env[name]?.trim()) { console.error(\"Production EAS environment is missing required \" + name + \"; configure it before requesting a production build.\"); process.exitCode = 1; } }"'

      - name: Verify main accepts the production release push
        if: inputs.lane == 'production'
        run: git push --dry-run origin HEAD:main

      - name: Bump version and create release commit and tag
        if: inputs.lane == 'production'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          node scripts/bump-version.js "$BUMP"
          VERSION="$(node -p "require('./app.json').expo.version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json package.json
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main --follow-tags

      - name: Bump version and create development/preview release commit
        if: inputs.lane == 'development' || inputs.lane == 'preview'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          node scripts/bump-version.js "$BUMP"
          VERSION="$(node -p "require('./app.json').expo.version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json package.json
          git commit -m "chore(release): v$VERSION"
          git push origin HEAD:main

      - name: Build development client Android APK
        if: inputs.lane == 'development'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@25.3.0 env:exec development 'EXPO_NO_DOTENV=1 eas build --platform android --profile development --non-interactive --no-wait --json'

      - name: Build preview Android APK
        if: inputs.lane == 'preview'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@25.3.0 env:exec preview 'EXPO_NO_DOTENV=1 eas build --platform android --profile preview --non-interactive --no-wait --json'

      - name: Build QA Android APK
        if: inputs.lane == 'qa'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@25.3.0 env:exec preview 'EXPO_NO_DOTENV=1 eas build --platform android --profile qa --non-interactive --no-wait --json'

      - name: Build production Android APK
        if: inputs.lane == 'production'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@25.3.0 env:exec production 'EXPO_NO_DOTENV=1 eas build --platform android --profile production --non-interactive --wait --json > "$RUNNER_TEMP/eas-build.json"'

      - name: Prove production APK is finished and installable
        if: inputs.lane == 'production'
        run: |
          set -euo pipefail
          STATUS="$(node -p "const b = require(process.env.RUNNER_TEMP + '/eas-build.json')[0]; b.status")"
          URL="$(node -p "const b = require(process.env.RUNNER_TEMP + '/eas-build.json')[0]; b.artifacts?.buildUrl ?? ''")"
          if [ "$STATUS" != "FINISHED" ] || [ -z "$URL" ]; then
            echo "Production build did not finish with an artifact (status: $STATUS)." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/apk"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/apk/caneguard-production.apk" "$URL"
          unzip -l "$RUNNER_TEMP/apk/caneguard-production.apk" | grep -q 'AndroidManifest.xml'
          unzip -l "$RUNNER_TEMP/apk/caneguard-production.apk" | grep -q 'classes.dex'
          SHA="$(sha256sum "$RUNNER_TEMP/apk/caneguard-production.apk" | cut -d' ' -f1)"
          {
            echo "### Production APK"
            echo "- Artifact URL: $URL"
            echo "- SHA-256: $SHA"
            echo "- Smoke check: downloaded; zip contains AndroidManifest.xml and classes.dex"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production APK
        if: inputs.lane == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: caneguard-production-apk
          path: ${{ runner.temp }}/apk/caneguard-production.apk
          if-no-files-found: error
