appId: com.niks0501.caneguard
name: P0-08 Path A complete in field with GPS and local finalization
tags:
  - p0
  - acceptance
  - gps
  - local-finalization
---
# Prerequisites: authenticated field reporter, reachable Metro, and a fresh
# development build with expo-location. The device must provide an acceptable
# foreground GPS reading for this path.
- addMedia:
    - ../../assets/model-fixtures/parity-reference.jpg
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- openLink: caneguardmobile:///scan
- extendedWaitUntil:
    visible:
      id: scan.screen
    timeout: 30000
- tapOn:
    id: scan.choose-gallery
- extendedWaitUntil:
    visible: "Photo taken on .*"
    timeout: 15000
- tapOn:
    text: "Photo taken on .*"
    index: 0
- runFlow:
    when:
      visible: Done
    commands:
      - tapOn: Done
- extendedWaitUntil:
    visible:
      id: scan.preview-screen
    timeout: 30000
- tapOn:
    id: scan.analyze-image
    enabled: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: scan.symptom-checklist-screen
    timeout: 120000
- tapOn:
    id: scan.symptom-rust
- tapOn:
    id: scan.continue-to-result
- extendedWaitUntil:
    visible:
      id: scan.result-title
      text: "Possible result: Rust"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: scan.keep-as-scan-only
    direction: DOWN
- tapOn:
    id: scan.keep-as-scan-only
    enabled: true
- extendedWaitUntil:
    visible:
      id: scan.record-saved
    timeout: 30000
- tapOn:
    id: scan.open-saved-record
- extendedWaitUntil:
    visible:
      id: records.details-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: records.open-field-report
    direction: DOWN
- tapOn:
    id: records.open-field-report
- extendedWaitUntil:
    visible:
      id: field-report.screen
    timeout: 30000
# D5: a brand-new Draft auto-attempts one GPS reading and raises the system
# location prompt. Decline it; the flow grants permission below and captures
# GPS explicitly.
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- scrollUntilVisible:
    element:
      id: field-report.farmer-name-input
    direction: DOWN
- tapOn:
    id: field-report.farmer-name-input
- inputText: P0 GPS Farmer
- pressKey: BACK
- tapOn:
    id: field-report.barangay-input
# The picker search field auto-focuses; a second tap can land on the Android
# keyboard settings control instead of the app-owned field.
- inputText: Wawa
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: field-report.barangay-input-option
      text: Wawa
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: field-report.barangay-input-option
      text: Wawa
    timeout: 10000
- tapOn:
    id: field-report.barangay-input-option
    index: 0
# Selecting the option collapses the picker and keyboard. Do not send another
# BACK/hide action here because it navigates back to the saved record.
# D4: affected area and estimated affected portion are required to finalize.
- scrollUntilVisible:
    element:
      id: field-report.affected-area-input
    direction: DOWN
- tapOn:
    id: field-report.affected-area-input
- inputText: "1.5"
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: field-report.affected-portion-input
    direction: DOWN
- tapOn:
    id: field-report.affected-portion-input
- inputText: "30"
- pressKey: BACK
# Location capture remounts the report from SQLite. Persist the entered fields
# before the GPS transition so the route cannot discard them.
- scrollUntilVisible:
    element:
      id: field-report.save-draft
    direction: DOWN
- tapOn:
    id: field-report.save-draft
- scrollUntilVisible:
    element:
      id: field-report.saved
    direction: DOWN
- assertVisible:
    id: field-report.saved
- setPermissions:
    permissions:
      location: allow
# After the save indicator is reached, the location section is above the
# current viewport; scroll back up to the GPS action.
- scrollUntilVisible:
    element:
      id: field-report.capture-gps
    direction: UP
- tapOn:
    id: field-report.capture-gps
- extendedWaitUntil:
    visible:
      id: field-report.gps-status
      text: "GPS location resolved with .*"
    timeout: 60000
- assertVisible:
    id: field-report.gps-evidence
- scrollUntilVisible:
    element:
      id: field-report.finalize
    direction: UP
# True Wi-Fi-off recovery is a manual acceptance step because this device uses
# wireless ADB. Keep Maestro connected and verify that local finalization is
# available; the separate manual procedure covers the radio-off path.
- extendedWaitUntil:
    visible:
      id: field-report.finalize
      enabled: true
    timeout: 30000
- takeScreenshot: .maestro/artifacts/p0-08-path-a-ready-to-finalize
- tapOn:
    id: field-report.finalize
- scrollUntilVisible:
    element:
      id: field-report.authoring-status
    direction: UP
- extendedWaitUntil:
    visible: "Finalized · (Needs attention|Pending upload|Uploading|Synced|Sync failed)"
    timeout: 30000
- takeScreenshot: .maestro/artifacts/p0-08-path-a-gps-pending
- extendedWaitUntil:
    visible: "Finalized · (Needs attention|Pending upload|Uploading|Synced|Sync failed)"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: field-report.retry-sync
    commands:
      - tapOn:
          id: field-report.retry-sync
- extendedWaitUntil:
    visible: "Finalized · Synced"
    timeout: 120000
- assertVisible: "Server report UUID"
- assertVisible: "Last synchronized"
- takeScreenshot: .maestro/artifacts/p0-08-path-a-gps-synced
- stopApp
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible:
      id: field-report.screen
    timeout: 120000
- assertVisible: "Finalized · Synced"
- assertVisible:
    id: field-report.inherited-evidence
- takeScreenshot: .maestro/artifacts/p0-08-path-a-gps-after-restart
