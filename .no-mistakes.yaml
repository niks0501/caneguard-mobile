
ignore_patterns:
  - "graphify-out/**"

protected_paths:
  - ".no-mistakes.yaml"
  - "drizzle/**"
  - "*.tflite"
  - "eas.json"
  - "app.config.js"
  - ".github/workflows/**"

document:
  instructions: |
    README.md owns setup; PROJECT_CHECKS.md owns verification commands.
    PROJECT_STACK.md owns architecture and platform rules.
    docs/ owns detailed feature and operational guidance.

commands:
  test: "npm test -- --runInBand src/features/sync/services/__tests__/syncFieldReport.test.ts"

review:
  conversation: false
  path_instructions:
    - path: "src/features/detection/**"
      instructions: "Preserve TFLite preprocessing, tensor shapes, labels and inference semantics; browser evidence is not native proof."
    - path: "src/database/**"
      instructions: "Preserve ownership isolation, atomic writes and existing persisted records."
    - path: "drizzle/**"
      instructions: "Preserve migration ordering and existing data; flag destructive or incompatible changes."
    - path: "src/features/sync/**"
      instructions: "Preserve unsynchronized reports, retry safety and idempotent uploads."

test:
  instructions: |
    Use PROJECT_CHECKS.md to select affected fast tests; full regression belongs in CI.
    No interactive checks in no-mistakes; live acceptance needs explicit implementation-phase authorization.
    For authorized browser-compatible UI acceptance, use npm run start -- --web --port <free-port> in an isolated session.
    Browser/Jest mocks cannot prove TFLite, permissions, secure storage or device persistence; native acceptance is separate.
    Record revision, command and actual evidence; unavailable required evidence is inconclusive, defects are no-go.
