name: Mobile build

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Build lane
        type: choice
        required: true
        options:
          - development
          - preview
          - qa
          - production
      expected_sha:
        description: Expected main commit SHA (40-character hex)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ inputs.lane }}
  cancel-in-progress: false

jobs:
  verify-revision:
    name: Require verified main commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check expected SHA and main Verify run
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "Mobile builds must be dispatched from main; received $DISPATCH_REF." >&2
            exit 1
          fi
          EXPECTED_SHA_NORMALIZED="$(printf '%s' "$EXPECTED_SHA" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if ! printf '%s' "$EXPECTED_SHA_NORMALIZED" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Expected a 40-character hexadecimal main commit SHA; received \"$EXPECTED_SHA\"." >&2
            exit 1
          fi
          if [ "$EXPECTED_SHA_NORMALIZED" != "$GITHUB_SHA" ]; then
            echo "Expected SHA ($EXPECTED_SHA_NORMALIZED) does not match dispatch commit ($GITHUB_SHA). Dispatch from the exact verified main commit." >&2
            exit 1
          fi
          response=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?event=push&branch=main&head_sha=$GITHUB_SHA&per_page=1")
          CI_RUN_RESPONSE="$response" node <<'NODE'
          const sha = process.env.GITHUB_SHA;
          const [run] = JSON.parse(process.env.CI_RUN_RESPONSE).workflow_runs ?? [];
          if (!run) {
            console.error(`No main Verify run found for ${sha}. Wait for CI, then dispatch again.`);
            process.exit(1);
          }
          if (run.head_sha !== sha || run.head_branch !== 'main' || run.event !== 'push') {
            console.error('The Verify run does not match the requested main commit.');
            process.exit(1);
          }
          if (run.status !== 'completed' || run.conclusion !== 'success') {
            console.error(`Verify must succeed for ${sha}. See ${run.html_url}, then dispatch again.`);
            process.exit(1);
          }
          console.log(`Verified ${sha} in ${run.html_url}`);
          NODE

  build:
    needs: verify-revision
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version and tag state
        id: release
        env:
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          VERSION="$(node <<'NODE'
          const assert = require('node:assert/strict');
          const { readFileSync } = require('node:fs');
          const app = JSON.parse(readFileSync('app.json', 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const appVersion = app.expo?.version;
          assert.match(String(appVersion ?? ''), /^\d+\.\d+\.\d+$/);
          assert.equal(appVersion, pkg.version, 'app.json expo.version and package.json version must agree');
          process.stdout.write(appVersion);
          NODE
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LANE" = "production" ]; then
            TAG="v$VERSION"
            REMOTE_TAG_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk 'END { if ($1 != "") print $1 }')"
            if [ -n "$REMOTE_TAG_SHA" ] && [ "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already points to $REMOTE_TAG_SHA, not $GITHUB_SHA. Bump the version in a release PR before running a new production build." >&2
              exit 1
            fi
          fi

      - name: Check production EAS environment
        if: inputs.lane == 'production'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@25.3.0 env:exec production 'EXPO_NO_DOTENV=1 node -e "for (const name of [\"EXPO_PUBLIC_AUTH_LINK_HOST\"]) { if (!process.env[name]?.trim()) { console.error(\"Production EAS environment is missing required \" + name + \"; configure it before requesting a production build.\"); process.exitCode = 1; } }" && EAS_BUILD_PROFILE=production node scripts/release-env.js --skip-upload'

      - name: Build development client Android APK
        if: inputs.lane == 'development'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@25.3.0 env:exec development "EXPO_NO_DOTENV=1 eas build --platform android --profile development --non-interactive --no-wait --json > \"$RUNNER_TEMP/eas-build.json\""
          cat "$RUNNER_TEMP/eas-build.json"

      - name: Build preview Android APK
        if: inputs.lane == 'preview'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@25.3.0 env:exec preview "EXPO_NO_DOTENV=1 eas build --platform android --profile preview --non-interactive --no-wait --json > \"$RUNNER_TEMP/eas-build.json\""
          cat "$RUNNER_TEMP/eas-build.json"

      - name: Build QA Android APK
        if: inputs.lane == 'qa'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@25.3.0 env:exec preview "EXPO_NO_DOTENV=1 eas build --platform android --profile qa --non-interactive --no-wait --json > \"$RUNNER_TEMP/eas-build.json\""
          cat "$RUNNER_TEMP/eas-build.json"

      - name: Build production Android APK
        if: inputs.lane == 'production'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@25.3.0 env:exec production "EXPO_NO_DOTENV=1 eas build --platform android --profile production --non-interactive --wait --json > \"$RUNNER_TEMP/eas-build.json\""

      - name: Prove production APK is finished and installable
        if: inputs.lane == 'production'
        id: apk
        run: |
          set -euo pipefail
          STATUS="$(node -p "const raw = require(process.env.RUNNER_TEMP + '/eas-build.json'); const b = Array.isArray(raw) ? raw[0] : raw; b?.status ?? ''")"
          URL="$(node -p "const raw = require(process.env.RUNNER_TEMP + '/eas-build.json'); const b = Array.isArray(raw) ? raw[0] : raw; b?.artifacts?.buildUrl ?? ''")"
          if [ "$STATUS" != "FINISHED" ] || [ -z "$URL" ]; then
            echo "Production build did not finish with an artifact (status: $STATUS)." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/apk"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/apk/caneguard-production.apk" "$URL"
          unzip -Z1 "$RUNNER_TEMP/apk/caneguard-production.apk" > "$RUNNER_TEMP/apk/entries.txt"
          grep -Fxq 'AndroidManifest.xml' "$RUNNER_TEMP/apk/entries.txt"
          grep -Fxq 'classes.dex' "$RUNNER_TEMP/apk/entries.txt"
          SHA="$(sha256sum "$RUNNER_TEMP/apk/caneguard-production.apk" | cut -d' ' -f1)"
          echo "artifact_url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Record source SHA and EAS build ID
        env:
          LANE: ${{ inputs.lane }}
          VERSION: ${{ steps.release.outputs.version }}
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact_url }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const raw = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/eas-build.json', 'utf8'));
          const build = Array.isArray(raw) ? raw[0] : raw;
          const buildId = build?.id;
          if (!buildId) {
            console.error('EAS build output did not include a build id.');
            process.exit(1);
          }
          const lines = [
            `### Mobile build (${process.env.LANE})`,
            `- Source SHA: \`${process.env.GITHUB_SHA}\``,
            `- App version: \`${process.env.VERSION}\``,
            `- EAS Build ID: \`${buildId}\``,
          ];
          if (build?.buildDetailsPageUrl) {
            lines.push(`- Build details URL: ${build.buildDetailsPageUrl}`);
          }
          if (process.env.LANE === 'production') {
            lines.push(`- Artifact URL: ${process.env.ARTIFACT_URL}`);
            lines.push(`- APK SHA-256: \`${process.env.APK_SHA256}\``);
            lines.push('- Smoke check: downloaded; zip contains AndroidManifest.xml and classes.dex');
          }
          const summary = `${lines.join('\n')}\n`;
          console.log(summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - name: Upload production APK
        if: inputs.lane == 'production'
        uses: actions/upload-artifact@v6
        with:
          name: caneguard-production-apk
          path: ${{ runner.temp }}/apk/caneguard-production.apk
          if-no-files-found: error

      - name: Tag verified production commit
        if: inputs.lane == 'production'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          REMOTE_TAG_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk 'END { if ($1 != "") print $1 }')"
          if [ -n "$REMOTE_TAG_SHA" ]; then
            if [ "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already points to $REMOTE_TAG_SHA, not $GITHUB_SHA." >&2
              exit 1
            fi
            echo "Tag $TAG already points to verified commit $GITHUB_SHA."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
            echo "Tagged verified production commit $GITHUB_SHA as $TAG."
          fi
