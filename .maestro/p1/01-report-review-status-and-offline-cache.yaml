appId: com.niks0501.caneguard
name: P1 report review status, feedback, refresh, and offline cache
tags:
  - p1
  - field-report
  - authority-review
---
# Prerequisites (performed outside this flow):
# - runtime-fresh Android development build and matching Metro bundle;
# - authenticated field reporter;
# - one owned finalized Field Report is already Finalized · Synced;
# - controlled backend fixture records the report's initial status, then changes
#   the same report to for_field_validation with plain-text feedback; and
# - the backend fixture can make the status endpoint unavailable for the final
#   offline/restart segment. Never place credentials or report content here.
# This scaffold is intentionally not executed by the implementation lane.
- openLink: caneguardmobile:///activity
- extendedWaitUntil:
    visible:
      id: activity.screen
    timeout: 30000
- tapOn:
    text: "Open .* saved .*"
    index: 0
- extendedWaitUntil:
    visible:
      id: records.details-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: records.open-field-report
    direction: DOWN
- tapOn:
    id: records.open-field-report
- extendedWaitUntil:
    visible:
      id: field-report.screen
    timeout: 30000
- assertVisible: "Finalized · Synced"
- assertVisible:
    id: field-report.authority-review-section
- tapOn:
    id: field-report.refresh-authority-status
- extendedWaitUntil:
    visible: "Field validation needed"
    timeout: 30000
- assertVisible: "Authority staff"
- assertVisible: "Latest feedback"
- takeScreenshot: .maestro/artifacts/p1-01-authority-update-feedback
- stopApp
- launchApp:
    clearState: false
- openLink: caneguardmobile:///activity
- extendedWaitUntil:
    visible:
      id: activity.screen
    timeout: 30000
- tapOn:
    text: "Open .* saved .*"
    index: 0
- extendedWaitUntil:
    visible:
      id: records.details-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: records.open-field-report
    direction: DOWN
- tapOn:
    id: records.open-field-report
- extendedWaitUntil:
    visible:
      id: field-report.screen
    timeout: 30000
- assertVisible: "Finalized · Synced"
- assertVisible: "Field validation needed"
- assertVisible: "Authority staff"
- takeScreenshot: .maestro/artifacts/p1-01-authority-offline-restart-cache
