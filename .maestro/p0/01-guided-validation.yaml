appId: com.niks0501.caneguard
name: T02 guided differential validation preserves disagreement
tags:
  - p0
  - t02
  - guided-validation
---
- addMedia:
    - ../../assets/model-fixtures/parity-reference.jpg
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- openLink: caneguardmobile://scan
- extendedWaitUntil:
    visible:
      id: scan.screen
    timeout: 30000
- tapOn:
    id: scan.choose-gallery
- extendedWaitUntil:
    visible: "Photo taken on .*"
    timeout: 15000
- tapOn:
    text: "Photo taken on .*"
    index: 0
- runFlow:
    when:
      visible: Done
    commands:
      - tapOn: Done
- extendedWaitUntil:
    visible:
      id: scan.preview-screen
    timeout: 30000
- tapOn:
    id: scan.analyze-image
    enabled: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: scan.symptom-checklist-screen
    timeout: 120000
- assertVisible:
    id: scan.guided-question
    text: "What visible pattern, if any, best describes the area you are checking?"
- assertVisible:
    id: scan.symptom-yellow-midrib
- assertVisible:
    id: scan.symptom-something-else
- assertVisible:
    id: scan.symptom-unable-to-tell
- assertNotVisible: "Mild"
- assertNotVisible: "Moderate"
- assertNotVisible: "Severe"
- tapOn:
    id: scan.symptom-something-else
- tapOn:
    id: scan.continue-to-result
- extendedWaitUntil:
    visible:
      id: scan.result-title
      text: "Possible result: Rust"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: scan.checklist-consistency
    direction: DOWN
- assertVisible:
    id: scan.checklist-consistency
- assertVisible: Checklist inconsistent
- assertVisible: "The selected observation differs from the model result. Both remain separate evidence, and this scan can still be reported to the office."
- scrollUntilVisible:
    element:
      id: scan.report-to-office
    direction: DOWN
- assertVisible:
    id: scan.report-to-office
- scrollUntilVisible:
    element:
      id: scan.keep-as-scan-only
    direction: DOWN
- assertVisible:
    id: scan.keep-as-scan-only
- scrollUntilVisible:
    element:
      id: scan.new-scan
    direction: DOWN
- assertVisible:
    id: scan.new-scan
- assertNotVisible: "Reported severity"
- assertNotVisible: "Mild"
- assertNotVisible: "Moderate"
- assertNotVisible: "Severe"
- takeScreenshot: .maestro/artifacts/t02-guided-validation-mismatch
- tapOn:
    id: scan.keep-as-scan-only
    enabled: true
- extendedWaitUntil:
    visible:
      id: scan.record-saved
    timeout: 30000
