appId: com.niks0501.caneguard
name: P0-09 fullscreen map hides navigation controls
tags:
  - p0
  - manual-map
  - fullscreen
---
# Run with: npm run e2e:flow -- .maestro/p0/09-map-fullscreen-navigation.yaml
# Precondition: an existing saved record has an incomplete Draft field report
# on this device. This flow preserves app state and does not encode credentials.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- openLink: caneguardmobile://records
- extendedWaitUntil:
    visible:
      id: records.screen
    timeout: 30000
- tapOn:
    text: "Open Possible result: Rust record saved .*"
    index: 0
- extendedWaitUntil:
    visible:
      id: records.details-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: records.open-field-report
    direction: DOWN
- tapOn:
    id: records.open-field-report
- extendedWaitUntil:
    visible:
      id: field-report.screen
    timeout: 30000
- assertVisible: Draft
- scrollUntilVisible:
    element:
      id: field-report.open-manual-map
    direction: DOWN
- tapOn:
    id: field-report.open-manual-map
- extendedWaitUntil:
    visible:
      id: manual-map.screen
    timeout: 30000
- tapOn:
    id: manual-map.fullscreen-toggle
- assertNotVisible:
    id: manual-map.controls
- assertNotVisible: "Pin Report Location"
- assertVisible:
    id: manual-map.fullscreen-toggle
- tapOn:
    id: manual-map.fullscreen-toggle
- assertVisible:
    id: manual-map.controls
- assertVisible: "Pin Report Location"
