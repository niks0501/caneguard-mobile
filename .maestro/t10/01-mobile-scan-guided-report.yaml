appId: com.niks0501.caneguard
name: T10 stages 1-4 - Mobile scan, guided validation, Report to Office, and API case
---
- setPermissions:
    permissions:
      location: allow
- addMedia:
    - ../../assets/model-fixtures/parity-reference.jpg
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - setClipboard: "http://127.0.0.1:8081"
      - pasteText
      - tapOn: Connect
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- tapOn: Start Scan
- extendedWaitUntil:
    visible:
      id: scan.screen
    timeout: 30000
- takeScreenshot: .maestro/artifacts/t10-01-mobile-scan
- tapOn:
    id: scan.choose-gallery
- extendedWaitUntil:
    visible: "Photo taken on .*"
    timeout: 15000
- tapOn:
    text: "Photo taken on .*"
    index: 0
- runFlow:
    when:
      visible: Done
    commands:
      - tapOn: Done
- extendedWaitUntil:
    visible:
      id: scan.preview-screen
    timeout: 30000
- tapOn:
    id: scan.analyze-image
    enabled: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: scan.symptom-checklist-screen
    timeout: 120000
- assertVisible:
    id: scan.guided-question
- tapOn:
    id: scan.symptom-something-else
- tapOn:
    id: scan.continue-to-result
- extendedWaitUntil:
    visible:
      id: scan.result-title
      text: "Possible result: Rust"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: scan.checklist-consistency
    direction: DOWN
- assertVisible: Checklist inconsistent
- assertVisible: "The selected observation differs from the model result. Both remain separate evidence, and this scan can still be reported to the office."
- takeScreenshot: .maestro/artifacts/t10-02-guided-validation-decision-support
- scrollUntilVisible:
    element:
      id: scan.report-to-office
    direction: DOWN
- tapOn:
    id: scan.report-to-office
    enabled: true
- extendedWaitUntil:
    visible:
      id: field-report.screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: field-report.farmer-name-input
    direction: DOWN
- tapOn:
    id: field-report.farmer-name-input
- setClipboard: T10 Phase 1 Block
- pasteText
- pressKey: BACK
- tapOn:
    id: field-report.barangay-input
- setClipboard: Wawa
- pasteText
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: field-report.barangay-input-option
      text: Wawa
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: field-report.barangay-input-option
      text: Wawa
    timeout: 10000
- tapOn:
    id: field-report.barangay-input-option
    index: 0
- scrollUntilVisible:
    element:
      id: field-report.affected-area-input
    direction: DOWN
- tapOn:
    id: field-report.affected-area-input
- setClipboard: "1.58"
- pasteText
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: field-report.affected-portion-input
    direction: DOWN
- tapOn:
    id: field-report.affected-portion-input
- setClipboard: "58"
- pasteText
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: field-report.gps-status
    direction: DOWN
- assertVisible:
    id: field-report.gps-status
- scrollUntilVisible:
    element:
      id: field-report.finalize
    direction: UP
- extendedWaitUntil:
    visible:
      id: field-report.finalize
      enabled: true
    timeout: 60000
- takeScreenshot: .maestro/artifacts/t10-03-report-to-office-ready
- tapOn:
    id: field-report.finalize
- scrollUntilVisible:
    element:
      id: field-report.authoring-status
    direction: UP
- extendedWaitUntil:
    visible: "Finalized · (Needs attention|Pending upload|Uploading|Synced|Sync failed|Waiting to sync|Will retry automatically)"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: field-report.retry-sync
    commands:
      - tapOn:
          id: field-report.retry-sync
- extendedWaitUntil:
    visible: "Finalized · Synced"
    timeout: 120000
- assertVisible: Server report UUID
- takeScreenshot: .maestro/artifacts/t10-04-api-case-synced
