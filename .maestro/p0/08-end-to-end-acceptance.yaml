appId: com.niks0501.caneguard
name: P0-08 end-to-end acceptance and evidence
tags:
  - p0
  - acceptance
  - evidence
---
# Path A: full scan, acceptable GPS, local finalization, connectivity recovery,
# synchronization, and restart persistence. True Wi-Fi-off recovery remains a
# manual step because this device uses wireless ADB.
- runFlow: 08-path-a-complete-in-field-gps.yaml

# Path B: the existing P0-02/P0-05/06 flows prove Draft persistence, online
# manual-map completion, provenance labeling, finalization, and local state.
# The checks below add the P0-08 sync and restart assertions for that same path.
- runFlow: 02-draft-report-lifecycle.yaml
- runFlow: 05-06-draft-manual-map-finalization.yaml
- extendedWaitUntil:
    visible: "Finalized · (Needs attention|Pending upload|Uploading|Synced|Sync failed)"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: field-report.retry-sync
    commands:
      - tapOn:
          id: field-report.retry-sync
- extendedWaitUntil:
    visible: "Finalized · Synced"
    timeout: 120000
- assertVisible: "Server report UUID"
- assertVisible: "Last synchronized"
- takeScreenshot: .maestro/artifacts/p0-08-path-b-manual-map-synced
- stopApp
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- openLink: caneguardmobile://activity
- extendedWaitUntil:
    visible:
      id: activity.screen
    timeout: 30000
- tapOn:
    text: "Open Possible result: Rust .* saved .*"
    index: 0
- extendedWaitUntil:
    visible:
      id: records.details-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: records.open-field-report
    direction: DOWN
- tapOn:
    id: records.open-field-report
- extendedWaitUntil:
    visible:
      id: field-report.screen
    timeout: 30000
- assertVisible: "Finalized · Synced"
- assertVisible:
    id: field-report.inherited-evidence
- takeScreenshot: .maestro/artifacts/p0-08-path-b-manual-map-after-restart
