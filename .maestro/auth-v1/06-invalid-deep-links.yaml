appId: com.niks0501.caneguard
name: Auth v1 invalid verification and reset deep links stay safe
tags:
  - auth-v1
  - auth-deep-link
  - auth-negative
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible: "Continue|Close|Get Started"
    timeout: 30000
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: Get Started
    timeout: 120000
- openLink: "caneguardmobile:///verify-email?id=1&hash=invalid&expires=4102444800&signature=invalid"
- extendedWaitUntil:
    visible:
      id: verify-email.error
    timeout: 30000
- assertVisible: "This email-verification link is invalid or expired.*"
- takeScreenshot: .maestro/artifacts/auth-v1-invalid-verification-link
- openLink: "caneguardmobile:///reset-password?email=invalid%40example.test&token=invalid"
- extendedWaitUntil:
    visible: Choose a new password
    timeout: 30000
- tapOn:
    id: reset-password.password-input
- inputText: ${AUTH_PASSWORD}
- tapOn:
    id: reset-password.submit
- extendedWaitUntil:
    visible:
      id: reset-password.error
    timeout: 30000
- assertVisible: "This recovery link is invalid, expired, or already used.*"
- takeScreenshot: .maestro/artifacts/auth-v1-invalid-reset-link
