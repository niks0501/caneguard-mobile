appId: com.niks0501.caneguard
name: P0-00 completed scan persists and reopens
tags:
  - p0
  - baseline
---
- addMedia:
    - ../../assets/model-fixtures/parity-reference.jpg
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- openLink: caneguardmobile://scan
- extendedWaitUntil:
    visible:
      id: scan.screen
    timeout: 30000
- tapOn:
    id: scan.choose-gallery
- extendedWaitUntil:
    visible: "Photo taken on .*"
    timeout: 15000
- tapOn:
    text: "Photo taken on .*"
    index: 0
- runFlow:
    when:
      visible: Done
    commands:
      - tapOn: Done
- extendedWaitUntil:
    visible:
      id: scan.preview-screen
    timeout: 30000
- tapOn:
    id: scan.analyze-image
    enabled: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: scan.symptom-checklist-screen
    timeout: 120000
- tapOn:
    id: scan.symptom-rust
- tapOn:
    id: scan.continue-to-result
- extendedWaitUntil:
    visible:
      id: scan.result-title
      text: "Possible result: Rust"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: scan.barangay-input
    direction: DOWN
- tapOn:
    id: scan.barangay-input
- inputText: P0 Baseline
- hideKeyboard
- scrollUntilVisible:
    element:
      id: scan.save-record
    direction: DOWN
- tapOn:
    id: scan.save-record
    enabled: true
- extendedWaitUntil:
    visible:
      id: scan.record-saved
    timeout: 30000
- takeScreenshot: .maestro/artifacts/p0-00-saved-result
- tapOn:
    id: scan.open-saved-record
- extendedWaitUntil:
    visible:
      id: records.details-screen
    timeout: 30000
- assertVisible:
    id: records.result-title
    text: "Possible result: Rust"
- scrollUntilVisible:
    element:
      id: records.barangay-value
    direction: DOWN
- assertVisible:
    id: records.barangay-value
    text: "P0 Baseline"
- takeScreenshot: .maestro/artifacts/p0-00-reopened-record
