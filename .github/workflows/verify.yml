name: Verify

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: caneguard-verify-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fast verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require manual releases to run from main
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Manual releases must be dispatched from main; received $GITHUB_REF." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python for the Guard V1 model oracle
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Guard V1 oracle packages
        run: python -m pip install numpy pillow ai-edge-litert

      - name: Run fast verification
        run: npm run verify:fast

      - name: Run Guard V1 real-binary oracle
        run: python3 scripts/tests/test_guard_v1_model.py

      - name: Export the Android bundle
        env:
          EXPO_NO_DOTENV: '1'
          EXPO_PUBLIC_API_BASE_URL: https://example.test
        run: npx --no-install expo export --platform android --output-dir "$RUNNER_TEMP/android-export"

  version-guard:
    name: Protect app version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate app version changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/version-guard.js
