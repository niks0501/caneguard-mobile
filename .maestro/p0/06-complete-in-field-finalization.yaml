appId: com.niks0501.caneguard
name: P0-06 complete-in-field report finalization
tags:
  - p0
  - complete-in-field
  - finalization
---
# Deny GPS before launch so the new Draft's automatic attempt stays on the
# manual-map path without changing permissions while a text field is focused.
- setPermissions:
    permissions:
      location: deny
- addMedia:
    - ../../assets/model-fixtures/parity-reference.jpg
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- openLink: caneguardmobile://scan
- extendedWaitUntil:
    visible:
      id: scan.screen
    timeout: 30000
- tapOn:
    id: scan.choose-gallery
- extendedWaitUntil:
    visible: "Photo taken on .*"
    timeout: 15000
- tapOn:
    text: "Photo taken on .*"
    index: 0
- runFlow:
    when:
      visible: Done
    commands:
      - tapOn: Done
- extendedWaitUntil:
    visible:
      id: scan.preview-screen
    timeout: 30000
- tapOn:
    id: scan.analyze-image
    enabled: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: scan.symptom-checklist-screen
    timeout: 120000
- tapOn:
    id: scan.symptom-rust
- tapOn:
    id: scan.continue-to-result
- extendedWaitUntil:
    visible:
      id: scan.result-title
      text: "Possible result: Rust"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: scan.save-record
    direction: DOWN
- tapOn:
    id: scan.save-record
    enabled: true
- extendedWaitUntil:
    visible:
      id: scan.record-saved
    timeout: 30000
- tapOn:
    id: scan.open-saved-record
- extendedWaitUntil:
    visible:
      id: records.details-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: records.open-field-report
    direction: DOWN
- tapOn:
    id: records.open-field-report
- extendedWaitUntil:
    visible:
      id: field-report.screen
    timeout: 30000
# D5: a brand-new Draft auto-attempts one GPS reading and raises the system
# location prompt. Decline it: this flow exercises the manual-map fallback.
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- scrollUntilVisible:
    element:
      id: field-report.farmer-name-input
    direction: DOWN
- tapOn:
    id: field-report.farmer-name-input
- inputText: P0 Complete Farmer
- pressKey: BACK
- tapOn:
    id: field-report.barangay-input
# The picker search field auto-focuses; a second tap can land on the Android
# keyboard settings control instead of the app-owned field.
- inputText: Wawa
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: field-report.barangay-input-option
      text: Wawa
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: field-report.barangay-input-option
      text: Wawa
    timeout: 10000
- tapOn:
    id: field-report.barangay-input-option
    index: 0
# Selecting the option collapses the picker and keyboard. Do not send another
# BACK/hide action here because it navigates back to the saved record.
# D4: affected area and estimated affected portion are required to finalize.
- scrollUntilVisible:
    element:
      id: field-report.affected-area-input
    direction: DOWN
- tapOn:
    id: field-report.affected-area-input
- inputText: "1.5"
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: field-report.affected-portion-input
    direction: DOWN
- tapOn:
    id: field-report.affected-portion-input
- inputText: "30"
- pressKey: BACK
# Location capture and the map route remount the report from SQLite. Persist the
# entered fields first so the route transition cannot discard them.
- scrollUntilVisible:
    element:
      id: field-report.save-draft
    direction: DOWN
- tapOn:
    id: field-report.save-draft
- scrollUntilVisible:
    element:
      id: field-report.saved
    direction: DOWN
- assertVisible:
    id: field-report.saved
# After the save indicator is reached, the location section is above the
# current viewport; scroll back up to the GPS action.
- scrollUntilVisible:
    element:
      id: field-report.capture-gps
    direction: UP
- tapOn:
    id: field-report.capture-gps
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
# The device may preserve an earlier GPS attempt instead of exposing a
# permission-specific message. The stable contract is the rendered status
# plus the available manual-map fallback.
- extendedWaitUntil:
    visible:
      id: field-report.gps-status
    timeout: 30000
- scrollUntilVisible:
    element:
      id: field-report.open-manual-map
    direction: DOWN
- tapOn:
    id: field-report.open-manual-map
- extendedWaitUntil:
    visible:
      id: manual-map.viewport
      enabled: true
    timeout: 30000
- tapOn:
    id: manual-map.viewport
- assertVisible:
    id: manual-map.pin
- scrollUntilVisible:
    element:
      id: manual-map.confirm
    direction: DOWN
- tapOn:
    id: manual-map.confirm
# Returning from the map route remounts the report screen at the top.
- scrollUntilVisible:
    element:
      id: field-report.manual-location
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: field-report.manual-location
      text: "Manual map .* GPS accuracy not applicable"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: field-report.finalize
    direction: UP
# True Wi-Fi-off recovery is a manual acceptance step because this device uses
# wireless ADB. Keep Maestro connected and verify that local finalization is
# available; the separate manual procedure covers the radio-off path.
- extendedWaitUntil:
    visible:
      id: field-report.finalize
      enabled: true
    timeout: 30000
- takeScreenshot: .maestro/artifacts/p0-06-ready-to-finalize
- tapOn:
    id: field-report.finalize
- scrollUntilVisible:
    element:
      id: field-report.authoring-status
    direction: UP
- extendedWaitUntil:
    visible: "Finalized · (Needs attention|Pending upload|Uploading|Synced|Sync failed)"
    timeout: 30000
- assertNotVisible:
    id: field-report.finalize
- takeScreenshot: .maestro/artifacts/p0-06-complete-in-field-finalized
