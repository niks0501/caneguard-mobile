appId: com.niks0501.caneguard
name: Auth v1 expired server session requires password reauthentication
tags:
  - auth-v1
  - auth-expiry
  - auth-reauthentication
---
# Precondition: first run 01-login-session-and-report-boundary.yaml, then expire
# the field-reporter token in the disposable local API database as documented
# by .maestro/evidence/AUTH-V1.md.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible: "Get Started|Back to login|Welcome back"
    timeout: 30000
- runFlow:
    when:
      visible: Get Started
    commands:
      - tapOn: I already have an account
- runFlow:
    when:
      visible: Back to login
    commands:
      - tapOn: Back to login
- extendedWaitUntil:
    visible:
      id: auth.login-screen
    timeout: 120000
- assertVisible: Welcome back
- tapOn:
    id: auth.email-input
- inputText: ${AUTH_EMAIL}
- tapOn:
    id: auth.password-input
- inputText: ${AUTH_PASSWORD}
- tapOn:
    id: auth.login-submit
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- tapOn:
    text: Open settings
- extendedWaitUntil:
    visible: Settings
    timeout: 30000
- tapOn:
    id: settings.account-security
- extendedWaitUntil:
    visible: Account & security
    timeout: 30000
- assertVisible: "Session expires .*"
- assertVisible: "Biometric unlock"
- takeScreenshot: .maestro/artifacts/auth-v1-expiry-password-reauthentication
