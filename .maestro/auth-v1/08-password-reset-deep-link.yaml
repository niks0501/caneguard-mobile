appId: com.niks0501.caneguard
name: Auth v1 password reset deep link revokes sessions
tags:
  - auth-v1
  - auth-recovery
  - auth-deep-link
---
# Precondition: hand the latest local reset link to the installed app from
# Chrome as documented by .maestro/evidence/AUTH-V1.md.
- extendedWaitUntil:
    visible:
      id: reset-password.password-input
    timeout: 60000
- tapOn:
    id: reset-password.password-input
- inputText: ${AUTH_NEW_PASSWORD}
- tapOn:
    id: reset-password.submit
- extendedWaitUntil:
    visible:
      id: reset-password.success
    timeout: 30000
- assertVisible: Password updated
- assertVisible: "All existing sessions were signed out.*"
- takeScreenshot: .maestro/artifacts/auth-v1-password-reset-deep-link
- tapOn: Return to login
- extendedWaitUntil:
    visible:
      id: auth.login-screen
    timeout: 30000
- tapOn:
    id: auth.email-input
- inputText: ${AUTH_EMAIL}
- tapOn:
    id: auth.password-input
- inputText: ${AUTH_NEW_PASSWORD}
- tapOn:
    id: auth.login-submit
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- assertVisible: Start Scan
