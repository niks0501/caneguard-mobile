name: QA over-the-air update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.candidate.outputs.publish }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify candidate changes
        id: candidate
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Manual QA updates must be dispatched from main; received $GITHUB_REF." >&2
            exit 1
          fi
          if ! git rev-parse --verify "$GITHUB_SHA^" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No prior main revision is available; skipping OTA publication."
            exit 0
          fi
          FILES="$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA")"
          echo "$FILES"
          if printf '%s\n' "$FILES" | grep -Eq '^(app\.json|app\.config\.[^/]+|eas\.json|metro\.config\.[^/]+|babel\.config\.[^/]+|package\.json|package-lock\.json|android/|ios/|plugins/)'; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Native, runtime, build configuration, app version, or dependency changes require a human build-versus-update decision; skipping OTA publication."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: classify
    if: needs.classify.outputs.publish == 'true'
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write OTA signing key
        env:
          EXPO_UPDATES_PRIVATE_KEY: ${{ secrets.EXPO_UPDATES_PRIVATE_KEY }}
        run: |
          if [ -z "$EXPO_UPDATES_PRIVATE_KEY" ]; then
            echo "Required GitHub Actions secret EXPO_UPDATES_PRIVATE_KEY is missing; add the Expo Updates signing private key before publishing." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$EXPO_UPDATES_PRIVATE_KEY" > "$RUNNER_TEMP/updates-key.pem"

      - name: Publish signed update to QA channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          npx --yes eas-cli@25.3.0 env:exec preview
          "EXPO_NO_DOTENV=1 EXPO_PUBLIC_QA_MODE=true EXPO_PUBLIC_APP_ENVIRONMENT=qa eas update --channel qa --environment preview --platform android --private-key-path \"\$RUNNER_TEMP/updates-key.pem\" --message \"qa/\${GITHUB_SHA:0:7}: \${GITHUB_EVENT_NAME}\" --non-interactive --json"

      - name: Remove OTA signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/updates-key.pem"
