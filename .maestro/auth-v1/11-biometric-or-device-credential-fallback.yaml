appId: com.niks0501.caneguard
name: Auth v1 biometric capability and password fallback
tags:
  - auth-v1
  - auth-biometric
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible: "Continue|Close|Get Started"
    timeout: 30000
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- extendedWaitUntil:
    visible: Get Started
    timeout: 120000
- tapOn: I already have an account
- extendedWaitUntil:
    visible:
      id: auth.login-screen
    timeout: 30000
- tapOn:
    id: auth.email-input
- inputText: ${AUTH_EMAIL}
- tapOn:
    id: auth.password-input
- inputText: ${AUTH_PASSWORD}
- tapOn:
    id: auth.login-submit
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- tapOn:
    text: Open settings
- extendedWaitUntil:
    visible: Settings
    timeout: 30000
- tapOn:
    id: settings.account-security
- extendedWaitUntil:
    visible: Account & security
    timeout: 30000
- assertVisible: Biometric unlock
- assertVisible: 'A strong platform biometric is available for this installation\.|Enroll a strong biometric in device settings before enabling this option\.|This device does not expose a strong platform biometric\. Use password sign-in\.|Biometric capability is unavailable until the native development build is ready\. Use password sign-in\.'
- takeScreenshot: .maestro/artifacts/auth-v1-biometric-fallback
