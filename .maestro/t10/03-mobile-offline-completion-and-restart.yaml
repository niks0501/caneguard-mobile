appId: com.niks0501.caneguard
name: T10 stages 8-9 - offline field validation completion and restart preservation
---
- setPermissions:
    permissions:
      location: allow
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- assertVisible: Offline
- tapOn: My Activity
- extendedWaitUntil:
    visible:
      id: activity.screen
    timeout: 30000
- scrollUntilVisible:
    element: "Field validation assignment ${T10_CASE_REFERENCE}"
    direction: DOWN
- tapOn: "Field validation assignment ${T10_CASE_REFERENCE}"
- extendedWaitUntil:
    visible:
      id: field-validation.screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: field-validation.observation-input
    direction: DOWN
- tapOn:
    id: field-validation.observation-input
- setClipboard: T10 leaves show localized orange-brown pustules without stem lodging.
- pasteText
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: field-validation.finding-input
    direction: DOWN
- tapOn:
    id: field-validation.finding-input
- setClipboard: T10 field evidence is consistent with rust symptoms and remains separate from the AI result.
- pasteText
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: field-validation.action-input
    direction: DOWN
- tapOn:
    id: field-validation.action-input
- setClipboard: T10 advised isolation, monitoring, and office review before any final disposition.
- pasteText
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: field-validation.complete
    direction: DOWN
- tapOn:
    id: field-validation.complete
- extendedWaitUntil:
    visible: Saved on this device
    timeout: 60000
- assertVisible: "The completed evidence is preserved locally and will retry automatically when connectivity returns."
- assertVisible: Visit time
- assertVisible: GPS
- assertVisible:
    id: field-validation.retry
- takeScreenshot: .maestro/artifacts/t10-08-mobile-offline-completion-pending
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- assertVisible: Offline
- tapOn: My Activity
- extendedWaitUntil:
    visible:
      id: activity.screen
    timeout: 30000
- scrollUntilVisible:
    element: "Field validation assignment ${T10_CASE_REFERENCE}"
    direction: DOWN
- tapOn: "Field validation assignment ${T10_CASE_REFERENCE}"
- extendedWaitUntil:
    visible:
      id: field-validation.screen
    timeout: 30000
- assertVisible: "${T10_CASE_REFERENCE}"
- scrollUntilVisible:
    element: Saved on this device
    direction: DOWN
- assertVisible: Saved on this device
- assertVisible: Visit time
- assertVisible:
    id: field-validation.retry
- takeScreenshot: .maestro/artifacts/t10-09-mobile-pending-after-restart
