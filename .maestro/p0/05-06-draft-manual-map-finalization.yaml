appId: com.niks0501.caneguard
name: P0-05/06 Draft completed later with manual map and finalized
tags:
  - p0
  - manual-map
  - finalization
---
# Precondition: run 02-draft-report-lifecycle.yaml first. It creates and
# reopens the latest incomplete report with farmer name "P0 Draft Farmer".
- setPermissions:
    permissions:
      location: deny
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: Connect
    commands:
      - tapOn: "http://"
      - inputText: "http://127.0.0.1:8081"
      - tapOn: Connect
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- openLink: caneguardmobile:///activity
- extendedWaitUntil:
    visible:
      id: activity.screen
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Open Possible result: Rust .* saved .*"
    direction: DOWN
- tapOn:
    text: "Open Possible result: Rust .* saved .*"
    index: 0
- extendedWaitUntil:
    visible:
      id: records.details-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: records.open-field-report
    direction: DOWN
- tapOn:
    id: records.open-field-report
- extendedWaitUntil:
    visible:
      id: field-report.screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: field-report.farmer-name-input
      text: P0 Draft Farmer
    direction: DOWN
- assertVisible:
    id: field-report.farmer-name-input
    text: P0 Draft Farmer
- scrollUntilVisible:
    element:
      id: field-report.capture-gps
    direction: DOWN
- tapOn:
    id: field-report.capture-gps
- runFlow:
    when:
      visible: "Don.t allow"
    commands:
      - tapOn: "Don.t allow"
- extendedWaitUntil:
    visible:
      id: field-report.gps-status
    timeout: 30000
- assertVisible:
    id: field-report.open-manual-map
- tapOn:
    id: field-report.open-manual-map
- extendedWaitUntil:
    visible:
      id: manual-map.screen
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: manual-map.viewport
      enabled: true
    timeout: 30000
- tapOn:
    id: manual-map.viewport
- assertVisible:
    id: manual-map.pin
- scrollUntilVisible:
    element:
      id: manual-map.confirm
    direction: DOWN
    centerElement: true
- tapOn:
    id: manual-map.confirm
- scrollUntilVisible:
    element:
      id: field-report.manual-location
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: field-report.manual-location
      text: "Manual map .* GPS accuracy not applicable"
    timeout: 30000
- takeScreenshot: .maestro/artifacts/p0-05-manual-location-saved
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- openLink: caneguardmobile:///activity
- extendedWaitUntil:
    visible:
      id: activity.screen
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Open Possible result: Rust .* saved .*"
    direction: DOWN
- tapOn:
    text: "Open Possible result: Rust .* saved .*"
    index: 0
- extendedWaitUntil:
    visible:
      id: records.details-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: records.open-field-report
    direction: DOWN
- assertVisible: Resume Draft
- tapOn:
    id: records.open-field-report
- scrollUntilVisible:
    element:
      id: field-report.farmer-name-input
      text: P0 Draft Farmer
    direction: DOWN
- assertVisible:
    id: field-report.farmer-name-input
    text: P0 Draft Farmer
- scrollUntilVisible:
    element:
      id: field-report.manual-location
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: field-report.manual-location
      text: "Manual map .* GPS accuracy not applicable"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: field-report.barangay-input
    direction: UP
- tapOn:
    id: field-report.barangay-input
# The picker search field auto-focuses; a second tap can land on the Android
# keyboard settings control instead of the app-owned field.
- inputText: Lumbangan
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: field-report.barangay-input-option
      text: Lumbangan
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: field-report.barangay-input-option
      text: Lumbangan
    timeout: 10000
- tapOn:
    id: field-report.barangay-input-option
    index: 0
# Selecting the option collapses the picker and keyboard. Do not send another
# BACK/hide action here because it navigates back to the saved record.
# D4: affected area and estimated affected portion are required to finalize.
- scrollUntilVisible:
    element:
      id: field-report.affected-area-input
    direction: DOWN
- tapOn:
    id: field-report.affected-area-input
- inputText: "2.5"
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: field-report.affected-portion-input
    direction: DOWN
- tapOn:
    id: field-report.affected-portion-input
- inputText: "40"
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: field-report.finalize
    direction: DOWN
- tapOn:
    id: field-report.finalize
- scrollUntilVisible:
    element:
      text: "Finalized · (Needs attention|Pending sync|Pending upload|Uploading|Synced|Sync failed)"
    direction: UP
- extendedWaitUntil:
    visible: "Finalized · (Needs attention|Pending sync|Pending upload|Uploading|Synced|Sync failed)"
    timeout: 30000
- assertVisible:
    id: field-report.authoring-status
- assertNotVisible:
    id: field-report.finalize
- takeScreenshot: .maestro/artifacts/p0-05-06-manual-finalized
